<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkHub</title>
    <link rel="icon" type="image/svg+xml" href="/images/workhub-icon.svg" />
    <link rel="apple-touch-icon" href="/images/workhub-icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="Your team. Your workspace. Plan, collaborate, and manage work together in WorkHub." />
    <meta property="og:title" content="WorkHub" />
    <meta property="og:description" content="Your team. Your workspace." />
    <meta property="og:image" content="https://qyan-om.web.app/images/workhub-social.png" />
<style>
html{background:#f8f9fc}html[data-theme=dark]{background:#222}body{margin:0}.workhub-boot{--boot-bg:#f8f9fc;--boot-surface:#fff;--boot-placeholder:#e9ebf2;display:flex;min-height:100dvh;background:var(--boot-bg);color:#292d3e;font-family:Arial,sans-serif}.workhub-boot *{box-sizing:border-box}html[data-theme=dark] .workhub-boot{--boot-bg:#222;--boot-surface:#2e2e2e;--boot-placeholder:#444;color:#f2f2f2}.workhub-boot aside{width:236px;flex:none;background:var(--boot-surface);padding:32px 24px}.workhub-boot strong{display:block;font-size:23px;margin-bottom:42px}.boot-nav{height:34px;margin:10px 0;border-radius:8px;background:var(--boot-placeholder);opacity:.55}.boot-spaces{margin-top:45px}.boot-line{height:12px;width:70%;background:var(--boot-placeholder);border-radius:5px;margin:22px 0}.boot-body{flex:1;min-width:0}.boot-body header{height:72px;background:var(--boot-surface);padding:4px 32px}.boot-body header .boot-line{width:180px}.boot-body main{padding:32px}.boot-heading{height:24px;width:220px;background:var(--boot-placeholder);border-radius:6px;margin:8px 0 28px}.boot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.boot-grid>div{height:150px;border-radius:14px;background:var(--boot-surface)}.boot-body section{margin-top:24px;padding:24px;border-radius:14px;background:var(--boot-surface);min-height:250px}.boot-body section .boot-line:nth-child(even){width:45%}html[data-boot-collapsed=true] .workhub-boot aside{width:76px;padding:24px 14px}html[data-boot-collapsed=true] .workhub-boot strong{font-size:0;height:35px;border-radius:10px;background:#7060cf}.boot-grid>div,.boot-nav,.boot-heading,.boot-line{animation:boot-pulse 1.8s ease-in-out infinite}@keyframes boot-pulse{50%{opacity:.5}}@media(prefers-reduced-motion:reduce){.workhub-boot *{animation:none}}@media(max-width:700px){.workhub-boot aside{width:76px;padding:24px 14px}.workhub-boot strong{font-size:0;height:35px;background:#7060cf;border-radius:10px}.boot-grid{grid-template-columns:1fr}.boot-grid>div{height:90px}.boot-body main{padding:20px}}
</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('workhub-prototype-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.bootCollapsed=String(localStorage.getItem('workhub-prototype-sidebar')==='collapsed');if(localStorage.getItem('workhub-prototype-language')==='ar'){document.documentElement.dir='rtl';document.documentElement.lang='ar'}}catch(e){}</script>
  </head>
  <body>
    <div id="root"><div class="workhub-boot" role="status" aria-label="Loading WorkHub" aria-busy="true"><aside><strong>WorkHub</strong><div class="boot-nav"></div><div class="boot-nav"></div><div class="boot-nav"></div><div class="boot-nav"></div><div class="boot-nav"></div><div class="boot-nav"></div><div class="boot-spaces"><div class="boot-line"></div><div class="boot-line"></div><div class="boot-line"></div></div></aside><div class="boot-body"><header><div class="boot-line"></div></header><main><div class="boot-heading"></div><div class="boot-grid"><div></div><div></div><div></div></div><section><div class="boot-line"></div><div class="boot-line"></div><div class="boot-line"></div><div class="boot-line"></div></section></main></div></div></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
