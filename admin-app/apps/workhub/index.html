<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>WorkHub</title>
    <link rel="icon" type="image/svg+xml" href="/images/workhub-icon.svg" />
    <link rel="apple-touch-icon" href="/images/workhub-icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="Your team. Your workspace. Plan, collaborate, and manage work together in WorkHub." />
    <meta property="og:title" content="WorkHub" />
    <meta property="og:description" content="Your team. Your workspace." />
    <meta property="og:image" content="https://qyan-om.web.app/images/workhub-social.png" />
<style>html{background:#f8f9fc}body{margin:0}.workhub-boot{min-height:100dvh;display:grid;place-items:center;background:#f8f9fc;color:#292d3e;font-family:system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}.boot-welcome{width:min(100%,380px)}.boot-logo{width:76px;height:76px;margin-bottom:16px}.boot-brand{font-size:20px;font-weight:700}.workhub-boot h1{font-size:26px;margin:32px 0 12px}.workhub-boot p{font-size:15px;color:#74798b;line-height:1.6}.boot-progress{width:130px;height:4px;border-radius:4px;background:#e9e5fa;margin:28px auto;overflow:hidden}.boot-progress:after{content:'';display:block;width:45%;height:100%;border-radius:4px;background:#7563d7;animation:boot-slide 1.4s ease-in-out infinite alternate}.boot-motivation{font-size:13px!important}html[data-theme=dark] .workhub-boot{background:#222;color:#f5f5f7}html[data-theme=dark] .workhub-boot p{color:#b4b4c0}@keyframes boot-slide{to{transform:translateX(125%)}}@media(prefers-reduced-motion:reduce){.boot-progress:after{animation:none;width:100%}}</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('workhub-prototype-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.bootCollapsed=String(localStorage.getItem('workhub-prototype-sidebar')==='collapsed');if(localStorage.getItem('workhub-prototype-language')==='ar'){document.documentElement.dir='rtl';document.documentElement.lang='ar'}}catch(e){}</script>
  </head>
  <body>
    <div id="root"><div class="workhub-boot" role="status" aria-busy="true"><div class="boot-welcome"><img class="boot-logo" src="/images/workhub-icon.svg" alt=""/><div class="boot-brand">WorkHub</div><h1 id="boot-greeting">Welcome</h1><p id="boot-message">Preparing your workspace…</p><div class="boot-progress" aria-hidden="true"></div><p class="boot-motivation" id="boot-motivation">Great work begins one step at a time.</p></div></div></div>
    <script>try{var ar=document.documentElement.lang==='ar',name=localStorage.getItem('workhub-welcome-name')||'';document.getElementById('boot-greeting').textContent=(ar?'مرحباً':'Welcome')+(name?', '+name:'');document.getElementById('boot-message').textContent=ar?'نجهز مساحة عملك…':'Preparing your workspace…';document.getElementById('boot-motivation').textContent=ar?'كل إنجاز يبدأ بخطوة.':'Great work begins one step at a time.'}catch(e){}</script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
