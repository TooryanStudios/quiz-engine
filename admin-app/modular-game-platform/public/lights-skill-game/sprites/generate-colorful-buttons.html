<!DOCTYPE html>
<html>
<head>
    <title>Colorful Game Button Generator</title>
    <style>
        body { 
            background: #1a1a2e; 
            color: #fff; 
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }
        .button-item {
            text-align: center;
        }
        canvas {
            border: 2px solid #444;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>Colorful Game-Style Button Graphics</h1>
    <p>Right-click each canvas and "Save image as..." to download</p>
    
    <div class="button-container" id="buttonContainer"></div>

    <script>
        const buttons = [
            { name: 'but_exit', icon: '✕', size: 100, colors: ['#ff4757', '#ff6348', '#ff7979'], label: 'Exit' },
            { name: 'but_restart', icon: '↻', size: 120, colors: ['#1dd1a1', '#10ac84', '#48dbfb'], label: 'Restart' },
            { name: 'but_restart_small', icon: '↻', size: 80, colors: ['#1dd1a1', '#10ac84', '#48dbfb'], label: 'Restart Small' },
            { name: 'but_yes', icon: '✓', size: 110, colors: ['#5f27cd', '#341f97', '#8e44ad'], label: 'Yes' },
            { name: 'but_no', icon: '✕', size: 110, colors: ['#ee5a6f', '#c23616', '#e74c3c'], label: 'No' },
            { name: 'but_home', icon: '⌂', size: 110, colors: ['#0abde3', '#00a8ff', '#3498db'], label: 'Home' },
            { name: 'but_arrow_left', icon: '◀', size: 90, colors: ['#feca57', '#ff9ff3', '#f368e0'], label: 'Arrow Left' },
            { name: 'but_arrow_right', icon: '▶', size: 90, colors: ['#feca57', '#ff9ff3', '#f368e0'], label: 'Arrow Right' },
            { name: 'but_play', icon: '▶', size: 110, colors: ['#00d2d3', '#01a3a4', '#48dbfb'], label: 'Play' },
            { name: 'but_next', icon: '→', size: 110, colors: ['#ff6b6b', '#ee5a6f', '#ff7979'], label: 'Next' }
        ];

        function createColorfulButton(config) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const size = config.size;
            
            canvas.width = size;
            canvas.height = size;

            const center = size / 2;
            const radius = size / 2 - 12;

            // Draw shadow/depth
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 8;

            // Main button gradient (vertical)
            const mainGradient = ctx.createLinearGradient(0, center - radius, 0, center + radius);
            mainGradient.addColorStop(0, config.colors[0]);
            mainGradient.addColorStop(0.5, config.colors[1]);
            mainGradient.addColorStop(1, config.colors[2]);

            ctx.beginPath();
            ctx.arc(center, center, radius, 0, Math.PI * 2);
            ctx.fillStyle = mainGradient;
            ctx.fill();

            // Reset shadow for inner elements
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            // Top highlight (glossy effect)
            const highlightGradient = ctx.createRadialGradient(
                center - radius * 0.3, center - radius * 0.4, 0,
                center, center - radius * 0.2, radius * 0.8
            );
            highlightGradient.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
            highlightGradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.2)');
            highlightGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            
            ctx.beginPath();
            ctx.arc(center, center - radius * 0.15, radius * 0.7, 0, Math.PI * 2);
            ctx.fillStyle = highlightGradient;
            ctx.fill();

            // Bottom shadow (3D depth)
            const bottomShadow = ctx.createRadialGradient(
                center, center + radius * 0.3, 0,
                center, center + radius * 0.3, radius * 0.6
            );
            bottomShadow.addColorStop(0, 'rgba(0, 0, 0, 0)');
            bottomShadow.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
            
            ctx.beginPath();
            ctx.arc(center, center + radius * 0.2, radius * 0.8, 0, Math.PI * 2);
            ctx.fillStyle = bottomShadow;
            ctx.fill();

            // Outer rim/border
            ctx.beginPath();
            ctx.arc(center, center, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Inner rim
            ctx.beginPath();
            ctx.arc(center, center, radius - 6, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw icon with shadow
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${size * 0.45}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Icon shadow
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 3;
            
            // Adjust position for arrow symbols
            let offsetX = 0;
            let offsetY = 0;
            if (config.icon === '◀') {
                offsetX = -size * 0.02;
            } else if (config.icon === '▶') {
                offsetX = size * 0.02;
            } else if (config.icon === '→') {
                offsetY = size * 0.01;
            }
            
            ctx.fillText(config.icon, center + offsetX, center + offsetY - 2);

            return canvas;
        }

        function createBackgroundGradient(width, height, name) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = width;
            canvas.height = height;

            const centerX = width / 2;
            const centerY = height / 2;
            
            // Radial gradient with vibrant colors
            const gradient = ctx.createRadialGradient(
                centerX, centerY, 0,
                centerX, centerY, Math.max(width, height) / 1.5
            );
            
            if (name === 'bg_menu') {
                gradient.addColorStop(0, '#2d3561');
                gradient.addColorStop(0.5, '#1a1f3a');
                gradient.addColorStop(1, '#0a0e27');
            } else if (name === 'bg_game') {
                gradient.addColorStop(0, '#34495e');
                gradient.addColorStop(0.5, '#2c3e50');
                gradient.addColorStop(1, '#1a252f');
            } else {
                gradient.addColorStop(0, '#3c3b6e');
                gradient.addColorStop(0.5, '#2b2d42');
                gradient.addColorStop(1, '#14151f');
            }

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Add colorful circuit pattern overlay
            const colors = ['rgba(52, 152, 219, 0.1)', 'rgba(155, 89, 182, 0.08)', 'rgba(46, 204, 113, 0.06)'];
            
            for (let i = 0; i < 30; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const size = 30 + Math.random() * 80;
                const colorIndex = Math.floor(Math.random() * colors.length);
                
                ctx.strokeStyle = colors[colorIndex];
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, size, size);
                
                // Add connecting lines
                ctx.beginPath();
                ctx.moveTo(x + size / 2, y);
                ctx.lineTo(x + size / 2, y + size);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y + size / 2);
                ctx.lineTo(x + size, y + size / 2);
                ctx.stroke();
                
                // Add small circles at intersections
                ctx.fillStyle = colors[colorIndex];
                ctx.beginPath();
                ctx.arc(x + size / 2, y + size / 2, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            return canvas;
        }

        // Generate buttons
        buttons.forEach(config => {
            const div = document.createElement('div');
            div.className = 'button-item';
            
            const canvas = createColorfulButton(config);
            const label = document.createElement('div');
            label.textContent = config.label;
            
            div.appendChild(canvas);
            div.appendChild(label);
            document.getElementById('buttonContainer').appendChild(div);
        });

        // Generate backgrounds
        const backgrounds = [
            { name: 'bg_menu', width: 768, height: 1400, label: 'Menu Background' },
            { name: 'bg_game', width: 768, height: 1400, label: 'Game Background' },
            { name: 'bg_end_panel', width: 768, height: 1400, label: 'End Panel Background' }
        ];

        backgrounds.forEach(config => {
            const div = document.createElement('div');
            div.className = 'button-item';
            
            const canvas = createBackgroundGradient(config.width, config.height, config.name);
            canvas.style.width = '200px';
            canvas.style.height = 'auto';
            
            const label = document.createElement('div');
            label.textContent = config.label;
            
            div.appendChild(canvas);
            div.appendChild(label);
            document.getElementById('buttonContainer').appendChild(div);
        });
    </script>
</body>
</html>
